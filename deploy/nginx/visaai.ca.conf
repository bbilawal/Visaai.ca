# visaai.ca — Canada-only VisaAI (web :3005, api :4001) on the shared VPS.
#   cp deploy/nginx/visaai.ca.conf /etc/nginx/sites-available/visaai.ca
#   ln -sf /etc/nginx/sites-available/visaai.ca /etc/nginx/sites-enabled/visaai.ca
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d visaai.ca -d www.visaai.ca -d api.visaai.ca
# IPv4 listeners only (see vps-ipv6 vhost note: a [::]:443 listener would
# serve this cert to every domain over IPv6).
server {
    listen 80;
    server_name visaai.ca www.visaai.ca;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
server {
    listen 80;
    server_name api.visaai.ca;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # intake / automation / voice WebSockets
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
