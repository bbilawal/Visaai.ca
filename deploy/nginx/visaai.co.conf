# VisaAI nginx reverse proxy — Hostinger VPS
# Web (Next.js) on 127.0.0.1:3000, API (NestJS) on 127.0.0.1:4000.
#
# Install on the VPS:
#   sudo cp deploy/nginx/visaai.co.conf /etc/nginx/sites-available/visaai.co
#   sudo ln -sf /etc/nginx/sites-available/visaai.co /etc/nginx/sites-enabled/visaai.co
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d visaai.co -d www.visaai.co -d visaai.ca -d www.visaai.ca -d api.visaai.co -d api.visaai.ca
# (certbot rewrites these blocks to listen 443 ssl and adds the 80->443 redirect.)
#
# NOTE: this file is version-controlled for reference. Your git auto-deploy hook
# pulls app code only — it does NOT copy this into /etc/nginx. Apply it once
# manually (above), or extend your deploy hook to sync + reload it.

# SEC-7004: don't advertise the nginx version in responses/error pages.
server_tokens off;

# SEC-7004: edge rate limiting as defence in depth on top of the app's own
# throttler. Keyed on the REAL client address ($binary_remote_addr), which is
# spoof-proof at this layer (see the X-Forwarded-For note below). `auth` is a
# tight bucket for the credential/security endpoints; `api` is a generous
# per-IP ceiling that only trips on abuse. Zones live in the http context; a
# site file included from nginx.conf's http{} is a valid place to declare them.
limit_req_zone $binary_remote_addr zone=visaai_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=visaai_api:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name visaai.co www.visaai.co;

    # SEC-7004: security headers at the edge (defence in depth; the Next.js app
    # also sets these). `always` so they apply to error responses too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is honoured by browsers only over HTTPS; harmless on :80 and preserved
    # after certbot rewrites this block to listen 443 ssl.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=visaai_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # Next.js HMR / any WS
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SEC-7001: OVERWRITE, never append. The API sets `trust proxy 1`, so a
        # client-supplied X-Forwarded-For would otherwise be read as the real IP
        # and defeat per-IP throttling and login lockout. $remote_addr is the
        # true peer as seen by nginx.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Canada site — a separate Next.js process built with NEXT_PUBLIC_SITE_MODE=canada.
# Keep this as a distinct server block: sharing port 3000 would serve the global
# build and silently defeat the domain separation.
server {
    listen 80;
    server_name visaai.ca www.visaai.ca;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=visaai_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name api.visaai.co;

    # Stripe webhook posts a raw body; do not let nginx buffer-limit it small.
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SEC-7004: tighter edge limit on the credential/security endpoints.
    location /auth/ {
        limit_req zone=visaai_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # SEC-7001: overwrite
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=visaai_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # REQUIRED: IntakeGateway + AutomationGateway WebSockets
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SEC-7001: OVERWRITE, never append (see the web block above).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Canada API — a separate NestJS process with SITE_MODE=canada on port 4001.
# Keeping this separate prevents Canada-only mode from restricting visaai.co.
server {
    listen 80;
    server_name api.visaai.ca;

    client_max_body_size 25m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=visaai_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
