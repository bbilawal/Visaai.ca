# =============================================================================
# EXAMPLE — REVIEW BEFORE USE. ClusterIP Services for api + web.
# =============================================================================
# ClusterIP (internal) — the Ingress terminates TLS and routes to these. The
# worker has NO Service (no inbound traffic).
apiVersion: v1
kind: Service
metadata:
  name: visaai-api
  namespace: visaai
  labels: { app: visaai-api }
spec:
  type: ClusterIP
  selector: { app: visaai-api }
  ports:
    - name: http
      port: 80
      targetPort: http     # -> containerPort 4000
---
apiVersion: v1
kind: Service
metadata:
  name: visaai-web
  namespace: visaai
  labels: { app: visaai-web }
spec:
  type: ClusterIP
  selector: { app: visaai-web }
  ports:
    - name: http
      port: 80
      targetPort: http     # -> containerPort 3000
