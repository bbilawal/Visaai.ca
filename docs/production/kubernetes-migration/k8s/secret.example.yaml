# =============================================================================
# EXAMPLE — REVIEW BEFORE USE. TEMPLATE ONLY — DO NOT COMMIT REAL VALUES.
# =============================================================================
# This is a placeholder shape. Do NOT put real secrets in git. In a real cluster
# use ONE of:
#   - Sealed Secrets (bitnami) — encrypt to a SealedSecret you CAN commit.
#   - External Secrets Operator — sync from Vault / AWS Secrets Manager / Doppler.
#   - `kubectl create secret generic ... --from-env-file` out-of-band (not in git).
#
# Keys mirror the required/secret vars in apps/api/src/config/configuration.ts.
# stringData lets you write plain values (k8s base64-encodes on apply).
apiVersion: v1
kind: Secret
metadata:
  name: visaai-api-secrets
  namespace: visaai
type: Opaque
stringData:
  # --- Supabase (managed Postgres stays) ---
  SUPABASE_URL: "https://<ref>.supabase.co"
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_ME"
  SUPABASE_ANON_KEY: "REPLACE_ME"
  SUPABASE_JWT_SECRET: "REPLACE_ME"
  # --- Redis (MANAGED instance for BullMQ — replaces the self-hosted VPS Redis) ---
  # Use a managed Redis with AOF/persistence + noeviction (see README §3 Redis note).
  REDIS_URL: "rediss://default:PASS@managed-redis-host:6379"
  # --- Upstash REST (LangGraph checkpoints — already managed, unchanged) ---
  UPSTASH_REDIS_REST_URL: "https://<name>.upstash.io"
  UPSTASH_REDIS_REST_TOKEN: "REPLACE_ME"
  # --- Stripe ---
  STRIPE_SECRET_KEY: "REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "REPLACE_ME"
  # --- AI providers ---
  OPENAI_API_KEY: "REPLACE_ME"
  # --- OCR provider key (matches OCR_PROVIDER in the ConfigMap) ---
  AZURE_DOC_INTEL_ENDPOINT: "https://<name>.cognitiveservices.azure.com/"
  AZURE_DOC_INTEL_KEY: "REPLACE_ME"
  # --- field encryption / inbound webhook (see configuration.ts) ---
  EMAIL_ENCRYPTION_KEY: "REPLACE_ME_64_HEX_CHARS"
  INBOUND_WEBHOOK_SECRET: "REPLACE_ME"
  # --- subscriptions price catalog (required when SUBSCRIPTIONS_ENABLED=true) ---
  SUBSCRIPTION_PRICES: '{"base":{"month":"price_x","year":"price_y"},"pro":{"month":"price_a","year":"price_b"},"premium":{"month":"price_c","year":"price_d"}}'
