# =============================================================================
# EXAMPLE — REVIEW BEFORE USE. Hardened successor to deploy/nginx/visaai.co.conf
# =============================================================================
# Adds over the current config: 80->443 redirect + HSTS, security headers, gzip,
# per-zone rate limiting, upstream blocks with passive health checks, and an
# explicit /health location. Preserves the two behaviours the app REQUIRES:
#   - WebSocket upgrade for api.visaai.co (IntakeGateway /intake, AutomationGateway
#     /automation) and Next.js HMR.
#   - Large raw body for the Stripe webhook (client_max_body_size).
#
# INSTALL (same as the current file):
#   sudo cp visaai.co.hardened.conf /etc/nginx/sites-available/visaai.co
#   sudo ln -sf /etc/nginx/sites-available/visaai.co /etc/nginx/sites-enabled/visaai.co
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d visaai.co -d www.visaai.co -d api.visaai.co
#
# NOTE: certbot normally injects the ssl_certificate lines and the 80->443 stub.
# This file writes the 443 blocks explicitly so the hardening is visible/reviewable.
# If you let certbot manage TLS, let it fill the ssl_certificate paths (shown as
# placeholders below) and DON'T duplicate the redirect.
#
# The rate-limit / gzip / map directives below are http-level and belong in
# /etc/nginx/nginx.conf (or /etc/nginx/conf.d/*.conf), NOT inside a server{}.
# They are shown here together for review; split them when installing.
# =============================================================================

# ---- http{} level: put these in nginx.conf or conf.d/visaai-http.conf -------
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
#
# # Rate-limit zones (keyed by client IP). 10m ~= 160k IPs tracked.
# #  - api_zone:   general API traffic
# #  - auth_zone:  tighter, for login/OTP style endpoints (tune paths below)
# limit_req_zone  $binary_remote_addr  zone=api_zone:10m   rate=20r/s;
# limit_req_zone  $binary_remote_addr  zone=auth_zone:10m  rate=5r/s;
# limit_req_status 429;
#
# gzip on;
# gzip_vary on;
# gzip_proto_min 1.1;
# gzip_comp_level 5;
# gzip_min_length 1024;
# gzip_types text/plain text/css application/json application/javascript
#            application/x-javascript text/xml application/xml application/xml+rss
#            text/javascript image/svg+xml application/wasm;
# # NOTE: Next.js already serves pre-compressed static assets; gzip here mainly
# # helps API JSON responses and any uncompressed HTML.

# ---- Upstreams (named, so max_fails gives passive health-based ejection) -----
upstream visaai_web {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}
upstream visaai_api {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# =========================== 80 -> 443 redirect ==============================
server {
    listen 80;
    listen [::]:80;
    server_name visaai.co www.visaai.co api.visaai.co;

    # ACME http-01 challenge must stay reachable on 80 for cert renewal.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# ============================ web: visaai.co =================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name visaai.co www.visaai.co;

    # certbot fills these (or point at your cert paths):
    ssl_certificate     /etc/letsencrypt/live/visaai.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visaai.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers ---
    # HSTS: only after you've confirmed HTTPS works everywhere (it is sticky).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP is app-specific and easy to break; start in Report-Only, then enforce.
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; ..." always;

    client_max_body_size 15m;   # matches MAX_UPLOAD_BYTES default (15 MB) for web uploads

    location / {
        proxy_pass http://visaai_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;              # Next.js HMR / WS
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ============================ api: api.visaai.co =============================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.visaai.co;

    ssl_certificate     /etc/letsencrypt/live/visaai.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visaai.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Stripe webhook posts a raw body; keep this generous (was 25m in current conf).
    client_max_body_size 25m;

    # --- Liveness: cheap, unthrottled, and EXCLUDED from rate limiting so
    #     uptime monitors and the deploy health-gate never get 429'd. ---
    location = /health {
        proxy_pass http://visaai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- WebSocket namespaces: MUST bypass limit_req (a rate limiter will kill
    #     long-lived upgrade connections). Match your socket.io path/namespaces. ---
    location ~ ^/(intake|automation|socket\.io)/ {
        proxy_pass http://visaai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;      # keep sockets open
        proxy_send_timeout 3600s;
    }

    # --- Everything else: rate-limited. burst absorbs spikes; nodelay serves
    #     the burst immediately then enforces the steady rate. ---
    location / {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://visaai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
